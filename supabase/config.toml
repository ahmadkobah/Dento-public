# Supabase Edge Functions Configuration
# https://supabase.com/docs/guides/functions/config
# 
# JWT verification is disabled at gateway level because we validate
# manually inside functions using supabase.auth.getUser(token)
# This prevents "Invalid JWT" errors from gateway-level validation

[functions.tenant-modules]
verify_jwt = false

